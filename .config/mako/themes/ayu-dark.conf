# Mako notification daemon configuration
# Themed for Ayu Dark (Hyprland)

# === Appearance ===
font=Iosevka Nerd Font Propo 12
background-color=#0d1017
text-color=#bfbdb6
border-color=#1b1f29
progress-color=over #4fbfff

border-size=2
border-radius=8
padding=12
margin=10
width=300
height=150

icon-path=/usr/share/icons/hicolor
max-icon-size=48
icons=1

# === Behavior ===
default-timeout=5000
ignore-timeout=0
layer=overlay
anchor=top-right

max-visible=5
history=true

# === Actions ===
actions=1
on-button-left=dismiss
on-button-middle=none
on-button-right=dismiss-all
on-touch=dismiss

# === Categories / Urgency Overrides ===
[urgency=low]
border-color=#1b1f29
default-timeout=4000

[urgency=normal]
border-color=#1b1f29
default-timeout=5000

[urgency=critical]
border-color=#f06b73
background-color=#141821
text-color=#bfbdb6
default-timeout=0