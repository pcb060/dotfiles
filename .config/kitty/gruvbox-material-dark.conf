# ~/.config/kitty/current-theme.conf
# Gruvbox Dark Material

# Background opacity
background_opacity 0.95

# Fonts (adjust size to taste)
font_family      FiraCode Nerd Font
bold_font        FiraCode Nerd Font Bold
font_size        11.0

# Colors - Gruvbox Dark Material palette
foreground              #d4be98
background              #282828

# Black
color0  #3c3836
color8  #504945

# Red
color1  #ea6962
color9  #ea6962

# Green
color2  #a9b665
color10 #a9b665

# Yellow
color3  #d8a657
color11 #d8a657

# Blue
color4  #7daea3
color12 #7daea3

# Magenta
color5  #d3869b
color13 #d3869b

# Cyan
color6  #89b482
color14 #89b482

# White
color7  #d4be98
color15 #ddc7a1

# Cursor
cursor            #d4be98
cursor_text_color #282828

# Selection
selection_foreground #282828
selection_background #d4be98

# URL underline color
url_color #7daea3
