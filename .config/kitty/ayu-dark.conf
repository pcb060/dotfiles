# ~/.config/kitty/ayu-dark.conf
# Ayu Dark Theme

# Background opacity
background_opacity 0.95

# Fonts (adjust size to taste)
font_family      Iosevka Nerd Font Propo
bold_font        Iosevka Nerd Font Propo Bold
font_size        11.0

# Colors - Ayu Dark palette
foreground              #bfbdb6
background              #0d1017

# Black (normal & bright)
color0  #1b1f29
color8  #686868

# Red
color1  #f06b73
color9  #f07178

# Green
color2  #70bf56
color10 #aad94c

# Yellow
color3  #fdb04c
color11 #ffb454

# Blue
color4  #4fbfff
color12 #59c2ff

# Magenta
color5  #d0a1ff
color13 #d2a6ff

# Cyan
color6  #93e2c8
color14 #95e6cb

# White (normal & bright)
color7  #c7c7c7
color15 #ffffff

# Cursor
cursor            #e6b450
cursor_text_color #0d1017

# Selection
selection_foreground #0d1017
selection_background #bfbdb6

# URL underline color
url_color #4fbfff
